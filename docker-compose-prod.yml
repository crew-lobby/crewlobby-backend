services:
  api:
    build:
      context: .
      target: production
    environment:
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT}:3333"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped