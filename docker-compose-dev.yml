services:
  api:
    build:
      context: .
      target: development
    environment:
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT}:3333"
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev