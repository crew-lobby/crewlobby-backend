x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: 3333
  DB_HOST: database
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-crewlobby}
  DB_USER: ${SERVICE_USER_POSTGRES}
  DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
  FRONTEND_URL: ${FRONTEND_URL:?}
  BETTER_AUTH_URL: ${SERVICE_URL_BACKEND_3333}
  BETTER_AUTH_SECRET: ${SERVICE_REALBASE64_64_BETTER_AUTH}

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runtime
    environment:
      <<: *backend-environment
      SERVICE_URL_BACKEND_3333: /
    expose:
      - "3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: migrate
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    exclude_from_hc: true

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crewlobby}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
